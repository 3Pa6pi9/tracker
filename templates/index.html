<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Intelligence Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        redTab: '#ef4444',
                        greenTab: '#10b981',
                        darkBg: '#0f172a',
                        cardBg: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-300 font-sans antialiased p-6 min-h-screen">

    <div class="max-w-7xl mx-auto">
        <!-- Header Section -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-white tracking-tight">Geopolitical Intelligence Hub</h1>
                <p class="text-sm text-slate-400 mt-1">Multi-Tier Handle Telemetry & Context Filtering System</p>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="system-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-900">
                    ● Live Feed Active
                </span>
                <button onclick="cleanupUAE()" class="text-xs bg-slate-800 hover:bg-red-950 border border-red-900/60 text-red-400 hover:text-red-300 py-2 px-3 rounded transition-all font-medium shadow-sm">
                    ⚠️ Purge UAE Records
                </button>
            </div>
        </header>

        <!-- Navigation Switcher Tabs -->
        <div class="flex space-x-4 mb-8">
            <button id="btn-red" onclick="switchTab('RED')" class="px-6 py-3 rounded-md font-semibold transition-all bg-redTab text-white shadow-lg shadow-red-500/20 flex items-center gap-2">
                <span>RED Stream</span>
                <span class="text-xs bg-red-900/60 px-2 py-0.5 rounded-full font-mono">Middle East</span>
            </button>
            <button id="btn-green" onclick="switchTab('GREEN')" class="px-6 py-3 rounded-md font-semibold transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-2">
                <span>GREEN Stream</span>
                <span class="text-xs bg-slate-900 px-2 py-0.5 rounded-full font-mono">Global / Diplomatic</span>
            </button>
        </div>

        <!-- Dynamic Data Grid -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated via asynchronous JavaScript injections -->
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let currentTab = 'RED';

        async function fetchNews(category) {
            const container = document.getElementById('news-container');
            container.innerHTML = `
                <div class="col-span-full text-center py-24">
                    <div class="inline-block animate-spin rounded-full h-8 border-4 border-solid border-slate-500 border-r-transparent align-[-0.125em] motion-reduce:animate-[spin_1.5s_linear_infinite] mb-4"></div>
                    <p class="text-slate-400 font-medium">Decrypting and compiling telemetry streams for ${category}...</p>
                </div>
            `;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/news?category=${category}`);
                if (!response.ok) throw new Error("Server failed to respond with valid telemetry data.");
                
                const data = await response.json();
                container.innerHTML = '';
                
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-cardBg border border-slate-800 rounded-lg p-12 text-center">
                            <p class="text-slate-400 text-lg font-medium">No matching intel archives found in the ${category} feed.</p>
                            <p class="text-slate-600 text-sm mt-1">Check back after the next scheduled ingestion worker sweep.</p>
                        </div>
                    `;
                    return;
                }

                data.forEach(item => {
                    const badgeColor = category === 'RED' 
                        ? 'bg-red-950/80 text-red-400 border-red-900/80' 
                        : 'bg-emerald-950/80 text-emerald-400 border-emerald-900/80';
                    
                    const formattedDate = new Date(item.published_date).toLocaleString();
                    
                    const card = `
                        <div class="bg-cardBg border border-slate-700/80 rounded-lg p-5 shadow-md hover:border-slate-500 transition-all flex flex-col justify-between group">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-xs font-mono border px-2.5 py-1 rounded-md ${badgeColor}">
                                        ${item.source}
                                    </span>
                                    <span class="text-[10px] text-slate-500 font-mono">${item.category}</span>
                                </div>
                                <h2 class="text-sm font-medium text-slate-100 mb-3 leading-relaxed group-hover:text-white">
                                    ${item.title}
                                </h2>
                            </div>
                            <div class="mt-4 flex justify-between items-center text-xs text-slate-500 border-t border-slate-800/80 pt-3">
                                <span class="font-mono">${formattedDate}</span>
                                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 font-semibold flex items-center gap-1 transition-colors">
                                    Source Link &rarr;
                                </a>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', card);
                });
            } catch (error) {
                container.innerHTML = `
                    <div class="col-span-full bg-red-950/20 border border-red-900/50 rounded-lg p-8 text-center">
                        <p class="text-red-400 font-semibold">Connection Error</p>
                        <p class="text-slate-400 text-sm mt-1">Unable to establish a link with the FastAPI background daemon at ${API_BASE_URL}. Verify backend status.</p>
                    </div>
                `;
            }
        }

        function switchTab(category) {
            currentTab = category;
            const btnRed = document.getElementById('btn-red');
            const btnGreen = document.getElementById('btn-green');

            if (category === 'RED') {
                btnRed.className = "px-6 py-3 rounded-md font-semibold transition-all bg-redTab text-white shadow-lg shadow-red-500/20 flex items-center gap-2";
                btnGreen.className = "px-6 py-3 rounded-md font-semibold transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-2";
            } else {
                btnGreen.className = "px-6 py-3 rounded-md font-semibold transition-all bg-greenTab text-white shadow-lg shadow-green-500/20 flex items-center gap-2";
                btnRed.className = "px-6 py-3 rounded-md font-semibold transition-all bg-slate-800 text-slate-400 hover:bg-slate-700 flex items-center gap-2";
            }

            fetchNews(category);
        }

        async function cleanupUAE() {
            if(confirm("SECURITY WARNING: This will permanently wipe all stored posts linked to UAE handles from the RED tab database. Proceed?")) {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/cleanup/uae`, { method: 'DELETE' });
                    const result = await res.json();
                    alert(result.message);
                    fetchNews(currentTab);
                } catch(e) {
                    alert("Error: Failed to transmit cleanup command to the API server.");
                }
            }
        }

        // Initialize display context on boot
        fetchNews('RED');
    </script>
</body>
</html>

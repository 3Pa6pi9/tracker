<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel Command Center • Global Telemetry Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0b0f19',
                        card: '#131d31',
                        bordercolor: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar { animation: radar-sweep 2.5s linear infinite; }
        
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-dark text-slate-300 font-sans min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full"></div>

    <!-- Sync Overlay -->
    <div id="sync-overlay" class="fixed inset-0 bg-dark/90 backdrop-blur-md z-40 flex flex-col items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="relative w-36 h-36 mb-6 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border border-indigo-500/20"></div>
            <div class="absolute inset-4 rounded-full border border-indigo-500/40"></div>
            <div class="absolute inset-10 rounded-full border border-indigo-500/60"></div>
            <div class="absolute inset-0 rounded-full animate-radar bg-[conic-gradient(from_0deg,transparent_0_300deg,rgba(99,102,241,0.4)_360deg)]"></div>
            <div class="w-4 h-4 bg-indigo-500 rounded-full animate-ping"></div>
        </div>
        <h3 class="text-lg font-bold text-white tracking-wider mb-1 flex items-center gap-2">HIGH-SPEED ASYNC SWEEP</h3>
        <p id="sync-progress-text" class="text-xs text-indigo-300 font-mono mb-6 text-center max-w-md animate-pulse">Executing concurrent batch processing...</p>
        <button onclick="hideSyncOverlay()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-xs font-semibold transition-colors pointer-events-auto shadow-lg">
            Dismiss & Run in Background
        </button>
    </div>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-bordercolor pb-4 mb-6 gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
                <span class="font-black text-xl text-white tracking-wider flex items-center gap-2">
                    INTEL <span class="text-indigo-400 font-light">ENGINE</span>
                </span>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 text-xs">
                <span id="last-sync-badge" class="text-[10px] font-mono text-slate-500 border border-slate-700/50 px-2 py-1 rounded bg-slate-800/30 hidden">
                    Synced: <span id="sync-time">Just now</span>
                </span>

                <span id="ws-status" class="px-3 py-1 rounded-lg border border-red-900 bg-red-950/50 text-red-400 font-mono">● Disconnected</span>
                
                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 shadow-inner">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span class="text-[10px] font-bold text-slate-300 tracking-wider">AUTO-PILOT ACTIVE</span>
                </div>

                <button id="sync-btn" onclick="forceSync()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-md transition-all active:scale-95 flex items-center gap-1.5">
                    ⚡ Sync Live Feed
                </button>
                <button onclick="exportCSV()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition-colors">
                    📥 Export CSV
                </button>
            </div>
        </header>

        <!-- Dynamic Visualization Chart -->
        <div class="bg-card/80 border border-bordercolor rounded-2xl p-4 mb-6 h-60 relative shadow-xl backdrop-blur-md">
            <canvas id="telemetryChart"></canvas>
            <div id="chart-empty" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 font-mono text-xs hidden bg-card/90 rounded-xl">
                <span>Awaiting Data Telemetry...</span>
                <span class="mt-1 opacity-75">Click 'Sync Live Feed' above to ingest streams.</span>
            </div>
        </div>

        <!-- Primary Category Tabs -->
        <div class="flex space-x-2 mb-6 border-b border-bordercolor pb-3">
            <button id="tab-all" onclick="switchCategory('ALL')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-500/20">
                🌐 ALL / GLOBAL TRENDS
            </button>
            <button id="tab-red" onclick="switchCategory('RED')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-400 hover:bg-slate-800">
                🔴 RED (Middle East & Crisis)
            </button>
            <button id="tab-general" onclick="switchCategory('GENERAL')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-400 hover:bg-slate-800">
                🔵 GENERAL (Global Diplomacy)
            </button>
        </div>

        <!-- Filters Console -->
        <div class="bg-card/40 p-4 rounded-2xl border border-bordercolor mb-6 space-y-4">
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search ANY topic live (e.g. potus, china, military, cyber, biden)..." class="w-full bg-card text-white border border-slate-700/80 rounded-xl pl-4 pr-10 py-3 text-xs focus:outline-none focus:border-indigo-500 shadow-inner transition-colors">
            </div>

            <!-- Fully Exposed Media Outlet Buttons -->
            <div class="flex flex-wrap gap-1.5 border-b border-slate-800 pb-3" id="sourceFilters">
                <button onclick="filterSource('All')" class="src-btn active px-3 py-1 rounded-lg font-semibold bg-indigo-600 text-white transition-colors">All Sources</button>
                <button onclick="filterSource('Google News')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Google News</button>
                <button onclick="filterSource('X (Twitter)')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">X (Twitter)</button>
                <button onclick="filterSource('Reddit')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Reddit</button>
                <button onclick="filterSource('Hacker News')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Hacker News</button>
                <button onclick="filterSource('Al Jazeera')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Al Jazeera</button>
                <button onclick="filterSource('Middle East Eye')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Middle East Eye</button>
                <button onclick="filterSource('Arab News')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Arab News</button>
                <button onclick="filterSource('Times of Israel')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Times of Israel</button>
                <button onclick="filterSource('Africanews')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">Africanews</button>
                <button onclick="filterSource('AllAfrica')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">AllAfrica</button>
                <button onclick="filterSource('DW News')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">DW News</button>
                <button onclick="filterSource('BBC World')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800 transition-colors">BBC World</button>
            </div>

            <div class="flex flex-wrap justify-between items-center gap-3 text-xs">
                <!-- Date Filters -->
                <div class="flex flex-wrap gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800" id="dateFilters">
                    <button onclick="filterDate('all')" class="date-btn px-3 py-1 rounded-lg font-semibold bg-indigo-600 text-white transition-all">All Time</button>
                    <button onclick="filterDate('1d')" class="date-btn px-3 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">Past 24h</button>
                    <button onclick="filterDate('7d')" class="date-btn px-3 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">Past 7d</button>
                    <button onclick="filterDate('30d')" class="date-btn px-3 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">Past 30d</button>
                </div>

                <!-- Dropdowns for Regions and Handles -->
                <div class="flex flex-wrap gap-2">
                    <select id="regionSelect" onchange="applyDropdownFilters()" class="bg-slate-900 text-slate-300 border border-slate-700 text-xs rounded-lg px-3 py-1.5 focus:outline-none transition-colors">
                        <option value="All">All Regions / Continents</option>
                        <option value="Middle East">Middle East</option>
                        <option value="Africa">Africa</option>
                        <option value="Europe">Europe</option>
                        <option value="Global">Global</option>
                    </select>

                    <select id="handleSelect" onchange="applyDropdownFilters()" class="bg-slate-900 text-slate-300 border border-slate-700 text-xs rounded-lg px-3 py-1.5 focus:outline-none max-w-[200px] transition-colors">
                        <option value="All">All Target Handles</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Data Grid -->
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-8"></div>

        <div class="flex justify-center mb-8">
            <button id="loadMoreBtn" onclick="loadMore()" class="hidden px-6 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition-all shadow-md">
                Load More Intelligence ↓
            </button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${WS_PROTOCOL}//${window.location.host}/ws/news`;

        let currentCategory = 'ALL';
        let currentSource = 'All';
        let currentRegion = 'All';
        let currentHandle = 'All';
        let currentTimeFilter = 'all';
        let searchQuery = '';
        let currentPage = 1;

        let telemetryChart = null;
        let ws = null;
        let syncTimerInterval;
        let secondsElapsed = 0;

        const sourceColors = {
            'Al Jazeera': 'bg-amber-500/10 text-amber-400 border-amber-500/20',
            'Middle East Eye': 'bg-red-500/10 text-red-400 border-red-500/20',
            'Arab News': 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
            'Times of Israel': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'Africanews': 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20',
            'AllAfrica': 'bg-green-600/10 text-green-400 border-green-600/20',
            'DW News': 'bg-blue-600/10 text-blue-300 border-blue-600/20',
            'BBC World': 'bg-red-600/10 text-red-300 border-red-600/20',
            'X (Twitter)': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'Google News': 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20',
            'Reddit': 'bg-orange-600/10 text-orange-500 border-orange-600/20',
            'Hacker News': 'bg-orange-500/10 text-orange-400 border-orange-500/20'
        };

        const skeletonCard = `
            <div class="bg-card/50 rounded-2xl p-5 border border-bordercolor animate-pulse h-44 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between mb-4">
                        <div class="h-4 bg-slate-700/50 rounded w-1/4"></div>
                        <div class="h-4 bg-slate-700/50 rounded w-1/6"></div>
                    </div>
                    <div class="space-y-3">
                        <div class="h-3 bg-slate-700/50 rounded w-3/4"></div>
                        <div class="h-3 bg-slate-700/50 rounded w-full"></div>
                        <div class="h-3 bg-slate-700/50 rounded w-5/6"></div>
                    </div>
                </div>
                <div class="border-t border-slate-700/50 pt-3 mt-4 flex justify-between">
                    <div class="h-3 bg-slate-700/50 rounded w-1/4"></div>
                    <div class="h-3 bg-slate-700/50 rounded w-1/5"></div>
                </div>
            </div>`;

        setInterval(() => { fetch(`${API_BASE}/api/ping`).catch(() => {}); }, 300000);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bgClass = "bg-slate-800 border-slate-700 text-slate-200";
            if (type === 'success') bgClass = "bg-emerald-950/90 border-emerald-800 text-emerald-300";
            if (type === 'warning') bgClass = "bg-amber-950/90 border-amber-800 text-amber-300";
            if (type === 'error') bgClass = "bg-red-950/90 border-red-800 text-red-300";
            if (type === 'info') bgClass = "bg-indigo-950/90 border-indigo-800 text-indigo-300";

            toast.className = `p-3.5 rounded-xl border text-xs font-mono shadow-2xl transition-all duration-300 transform translate-y-5 opacity-0 pointer-events-auto flex items-center justify-between backdrop-blur-md ${bgClass}`;
            toast.innerHTML = `<div class="flex items-center gap-2"><span>${message}</span></div><button onclick="this.parentElement.remove()" class="ml-3 opacity-60 hover:opacity-100">&times;</button>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-5', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 6000);
        }

        function showSyncOverlay() {
            const overlay = document.getElementById('sync-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100', 'pointer-events-auto');
        }

        function hideSyncOverlay() {
            const overlay = document.getElementById('sync-overlay');
            overlay.classList.remove('opacity-100', 'pointer-events-auto');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function resetSyncButton() {
            clearInterval(syncTimerInterval);
            const syncBtn = document.getElementById('sync-btn');
            syncBtn.innerHTML = "⚡ Sync Live Feed";
            syncBtn.classList.replace('bg-slate-700', 'bg-indigo-600');
            syncBtn.disabled = false;
            hideSyncOverlay();
        }
        
        function updateSyncBadge(timeStr) {
            const badge = document.getElementById('last-sync-badge');
            const timeEl = document.getElementById('sync-time');
            badge.classList.remove('hidden');
            timeEl.innerText = timeStr || "Just now";
        }

        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            const statusBadge = document.getElementById('ws-status');
            const syncBtn = document.getElementById('sync-btn');
            
            ws.onopen = () => {
                statusBadge.className = "px-3 py-1 rounded-lg border border-emerald-900 bg-emerald-950/50 text-emerald-400 font-mono";
                statusBadge.innerHTML = "● Live WebSocket Active";
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.event === "sync_started") {
                    syncBtn.classList.replace('bg-indigo-600', 'bg-slate-700');
                    syncBtn.disabled = true;
                    showSyncOverlay();
                    showToast("⚡ High-speed async sweep initiated...", "info");
                    
                    clearInterval(syncTimerInterval);
                    secondsElapsed = 0;
                    syncTimerInterval = setInterval(() => {
                        secondsElapsed++;
                        syncBtn.innerHTML = `⏳ Scraping... ${secondsElapsed}s`;
                        if (secondsElapsed > 20) { resetSyncButton(); showToast("⚠️ Render limits active. Task finishing silently.", "warning"); }
                    }, 1000);
                } 
                else if (data.event === "sync_started_silent") {
                    syncBtn.classList.replace('bg-indigo-600', 'bg-slate-700');
                    syncBtn.disabled = true;
                    clearInterval(syncTimerInterval);
                    secondsElapsed = 0;
                    syncTimerInterval = setInterval(() => {
                        secondsElapsed++;
                        syncBtn.innerHTML = `🤖 Auto-Scraping... ${secondsElapsed}s`;
                        if (secondsElapsed > 20) resetSyncButton();
                    }, 1000);
                }
                else if (data.event === "new_intel") {
                    resetSyncButton();
                    updateSyncBadge(data.time);
                    if (data.silent) showToast(`🤖 Auto-Pilot Intercepted ${data.count} new records.`, "success");
                    else showToast(`✅ Sweep Complete! Intercepted ${data.count} new records.`, "success");
                    fetchNews(true); 
                    loadChartData();
                    populateDropdowns();
                }
                else if (data.event === "sync_finished_no_data") {
                    resetSyncButton();
                    updateSyncBadge(data.time);
                    if (!data.silent) showToast("ℹ️ Sweep Finished. No new records found.", "warning");
                }
            };

            ws.onclose = () => {
                statusBadge.className = "px-3 py-1 rounded-lg border border-red-900 bg-red-950/50 text-red-400 font-mono";
                statusBadge.innerHTML = "● Reconnecting...";
                setTimeout(connectWebSocket, 5000);
            };
        }

        async function populateDropdowns() {
            try {
                const res = await fetch(`${API_BASE}/api/meta/filters`);
                const meta = await res.json();
                const handleSelect = document.getElementById('handleSelect');
                let hHtml = '<option value="All">All Target Handles</option>';
                meta.handles.forEach(h => { hHtml += `<option value="${h}">${h}</option>`; });
                handleSelect.innerHTML = hHtml;
            } catch(e){}
        }

        async function forceSync() {
            try { await fetch(`${API_BASE}/api/sync`, { method: 'POST' }); }
            catch(e) { showToast("❌ Could not communicate with server API.", "error"); }
        }

        function filterSource(src) {
            currentSource = src;
            document.querySelectorAll('.src-btn').forEach(btn => {
                const btnText = btn.innerText.trim();
                if (btnText === src || (src === 'All' && btnText === 'All Sources')) {
                    btn.classList.replace('bg-slate-900', 'bg-indigo-600');
                    btn.classList.replace('text-slate-400', 'text-white');
                } else {
                    btn.classList.replace('bg-indigo-600', 'bg-slate-900');
                    btn.classList.replace('text-white', 'text-slate-400');
                }
            });
            fetchNews(true);
        }

        function applyDropdownFilters() {
            currentRegion = document.getElementById('regionSelect').value;
            currentHandle = document.getElementById('handleSelect').value;
            fetchNews(true);
        }

        async function fetchNews(overwrite = false) {
            const grid = document.getElementById('grid');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if (overwrite) {
                currentPage = 1;
                grid.innerHTML = skeletonCard.repeat(6);
            }
            
            try {
                const url = new URL(`${API_BASE}/api/news`);
                url.searchParams.append('category', currentCategory);
                url.searchParams.append('source', currentSource);
                url.searchParams.append('region', currentRegion);
                url.searchParams.append('handle', currentHandle);
                url.searchParams.append('time_filter', currentTimeFilter);
                url.searchParams.append('page', currentPage);
                url.searchParams.append('limit', 15);
                if (searchQuery) url.searchParams.append('q', searchQuery);

                const response = await fetch(url);
                const data = await response.json();
                
                if (overwrite) grid.innerHTML = '';

                if (data.length < 15) loadMoreBtn.classList.add('hidden');
                else loadMoreBtn.classList.remove('hidden');

                if (data.length === 0 && currentPage === 1) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center text-slate-500 py-16 bg-card/20 rounded-2xl border border-bordercolor fade-in">
                            <p class="text-xs font-medium text-slate-400">No records found matching your active filter criteria.</p>
                            <p class="text-[11px] text-slate-600 mt-1">If feeds are empty, click 'Sync Live Feed' above.</p>
                        </div>`;
                    return;
                }

                data.forEach(item => {
                    const colorClass = sourceColors[item.source] || 'bg-slate-500/10 text-slate-400 border-slate-500/20';
                    const dateObj = new Date(item.published_date || item.fetched_at);
                    const dateString = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                    const handleBadge = (item.handle && item.handle !== 'N/A') ? `<span class="text-[10px] text-indigo-400 font-mono bg-indigo-500/10 px-1.5 py-0.5 rounded border border-indigo-500/20">${item.handle}</span>` : '';
                    const keywordBadge = item.keyword ? `<span class="text-[10px] text-slate-400 font-mono bg-slate-800/80 px-1.5 py-0.5 rounded border border-slate-700/80">🔑 ${item.keyword}</span>` : '';

                    const card = `
                        <a href="${item.link}" target="_blank" class="block group fade-in">
                            <div class="bg-card rounded-2xl p-5 border border-bordercolor hover:border-indigo-500/40 transition-all duration-300 shadow-lg hover:shadow-indigo-500/5 h-full flex flex-col justify-between relative overflow-hidden">
                                <div>
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg border ${colorClass}">${item.source}</span>
                                            ${handleBadge}
                                            ${keywordBadge}
                                        </div>
                                        <span class="text-[10px] text-slate-500 font-mono">${item.region || 'Global'}</span>
                                    </div>
                                    <h3 class="text-slate-200 text-xs font-medium leading-relaxed group-hover:text-indigo-300 transition-colors line-clamp-3">
                                        ${item.title}
                                    </h3>
                                </div>
                                <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-[10px] text-slate-500 group-hover:text-indigo-400 transition-colors">
                                    <span>${dateString}</span>
                                    <span class="flex items-center gap-1 font-bold">Access Source →</span>
                                </div>
                            </div>
                        </a>
                    `;
                    grid.insertAdjacentHTML('beforeend', card);
                });
            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-12 text-xs">Error loading feeds from server API.</div>`;
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            ['all', 'red', 'general'].forEach(c => {
                const btn = document.getElementById(`tab-${c}`);
                if (c === cat.toLowerCase()) btn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-500/20";
                else btn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-400 hover:bg-slate-800";
            });
            fetchNews(true);
        }

        function filterDate(rangeKey) {
            currentTimeFilter = rangeKey;
            document.querySelectorAll('.date-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(rangeKey)) {
                    btn.classList.add('bg-indigo-600', 'text-white');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('text-slate-400');
                }
            });
            fetchNews(true);
        }

        // 500ms Input Debounce for Live Web Search
        let searchTimeout;
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = document.getElementById('searchInput').value.trim();
                fetchNews(true);
            }, 500);
        }

        function loadMore() {
            currentPage++;
            fetchNews(false);
        }

        function exportCSV() {
            window.location.href = `${API_BASE}/api/export?category=${currentCategory}`;
        }

        async function loadChartData() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                const emptyState = document.getElementById('chart-empty');
                
                if (!data.dates || data.dates.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                } else {
                    emptyState.classList.add('hidden');
                }

                const ctx = document.getElementById('telemetryChart').getContext('2d');
                if(telemetryChart) telemetryChart.destroy();
                
                telemetryChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.dates,
                        datasets: [
                            { label: 'Global Stream', data: data.ALL, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.1)', borderWidth: 2, fill: true, tension: 0.3 },
                            { label: 'RED Stream', data: data.RED, borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', borderWidth: 2, fill: true, tension: 0.3 },
                            { label: 'GENERAL Stream', data: data.GENERAL, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', borderWidth: 2, fill: true, tension: 0.3 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
                        scales: {
                            x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 9 } } },
                            y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 9 }, stepSize: 1 } }
                        }
                    }
                });
            } catch (e){}
        }

        connectWebSocket();
        populateDropdowns();
        loadChartData();
        fetchNews(true);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel Command Center &bull; Professional Search Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0b0f19',
                        card: '#131d31',
                        bordercolor: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-slate-300 font-sans min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-indigo-600 text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 border border-indigo-400/30">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="toastMessage">Action completed successfully</span>
    </div>

    <!-- Navbar -->
    <nav class="bg-card/80 backdrop-blur-md border-b border-bordercolor sticky top-0 z-40 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
                    <span class="font-black text-lg text-white tracking-wider flex items-center gap-2">
                        INTEL <span class="text-indigo-400 font-light">ENGINE</span>
                    </span>
                </div>

                <!-- Telemetry Stats Badge -->
                <div class="hidden md:flex items-center space-x-6 text-xs text-slate-400 font-mono">
                    <div class="flex items-center space-x-1.5 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-800">
                        <span class="text-slate-500">Indexed:</span>
                        <span id="statTotal" class="text-indigo-400 font-bold">0</span>
                    </div>
                </div>

                <button onclick="manualRefresh()" id="refreshBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-md transition-all duration-200 flex items-center space-x-2 active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span>Sync Feed</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow">
        
        <!-- Search Engine Box -->
        <div class="mb-4 relative max-w-2xl mx-auto">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search global intel database or query live web..." 
                class="w-full bg-card/90 text-white border border-slate-700/80 rounded-2xl pl-12 pr-24 py-4 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all shadow-xl placeholder-slate-500 text-sm"
                onkeypress="handleKeyPress(event)"
                oninput="toggleClearIcon(this)"
            >
            <!-- Clear Input X Button -->
            <button id="clearBtn" onclick="clearSearchInput()" class="hidden absolute inset-y-0 right-24 flex items-center pr-2 text-slate-500 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <button onclick="executeSearch()" class="absolute inset-y-2 right-2 px-5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition-all shadow-md">
                Search
            </button>
        </div>

        <!-- Quick Query Suggestion Pills -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-8 text-xs">
            <span class="text-slate-500 font-medium">Trending Focus:</span>
            <button onclick="quickSearch('Geopolitics')" class="px-2.5 py-1 bg-slate-800/60 hover:bg-indigo-600/30 hover:text-indigo-300 border border-slate-700/60 rounded-md transition-colors text-slate-400">#Geopolitics</button>
            <button onclick="quickSearch('Migration crisis')" class="px-2.5 py-1 bg-slate-800/60 hover:bg-indigo-600/30 hover:text-indigo-300 border border-slate-700/60 rounded-md transition-colors text-slate-400">Migration Crisis</button>
            <button onclick="quickSearch('Foreign policy')" class="px-2.5 py-1 bg-slate-800/60 hover:bg-indigo-600/30 hover:text-indigo-300 border border-slate-700/60 rounded-md transition-colors text-slate-400">Foreign Policy</button>
            <button onclick="quickSearch('Border security')" class="px-2.5 py-1 bg-slate-800/60 hover:bg-indigo-600/30 hover:text-indigo-300 border border-slate-700/60 rounded-md transition-colors text-slate-400">Border Security</button>
            <button onclick="quickSearch('Diplomacy')" class="px-2.5 py-1 bg-slate-800/60 hover:bg-indigo-600/30 hover:text-indigo-300 border border-slate-700/60 rounded-md transition-colors text-slate-400">Diplomacy</button>
        </div>

        <!-- Filter Controls Container -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8 bg-card/40 p-3 rounded-2xl border border-bordercolor">
            <!-- Source Filters -->
            <div class="flex flex-wrap gap-1.5 justify-center" id="sourceFilters">
                <button onclick="filterSource('All')" class="source-btn active px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white transition-all shadow-sm">All Sources</button>
                <button onclick="filterSource('X (Twitter)')" class="source-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900/60 hover:bg-slate-800 text-slate-400 transition-all">X / Twitter</button>
                <button onclick="filterSource('Google News')" class="source-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900/60 hover:bg-slate-800 text-slate-400 transition-all">Google News</button>
                <button onclick="filterSource('Hacker News')" class="source-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900/60 hover:bg-slate-800 text-slate-400 transition-all">Hacker News</button>
                <button onclick="filterSource('Reddit')" class="source-btn px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-900/60 hover:bg-slate-800 text-slate-400 transition-all">Reddit</button>
            </div>

            <!-- Date Filters -->
            <div class="flex flex-wrap gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button onclick="filterDate('all')" class="date-btn px-3 py-1 rounded-lg text-xs font-medium bg-indigo-600 text-white transition-all">All Time</button>
                <button onclick="filterDate('1d')" class="date-btn px-3 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">Past 24h</button>
                <button onclick="filterDate('7d')" class="date-btn px-3 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">Past 7d</button>
                <button onclick="filterDate('30d')" class="date-btn px-3 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition-all">Past 30d</button>
            </div>
        </div>

        <!-- Loader State -->
        <div id="loader" class="hidden flex flex-col items-center justify-center py-28">
            <svg class="animate-spin h-10 w-10 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-xs font-mono text-slate-400 tracking-wider animate-pulse">QUERYING LIVE CHANNELS...</p>
        </div>

        <!-- Data Grid -->
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Cards injected via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-bordercolor py-5 text-center text-xs text-slate-500 bg-card/30">
        Intel Command Center &bull; High-Performance Search & Telemetry Engine
    </footer>

    <script>
        let allData = [];
        let currentSource = 'All';
        let currentTimeFilter = 'all';

        const sourceColors = {
            'X (Twitter)': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'Google News': 'bg-red-500/10 text-red-400 border-red-500/20',
            'Hacker News': 'bg-orange-500/10 text-orange-400 border-orange-500/20',
            'Reddit': 'bg-orange-600/10 text-orange-500 border-orange-600/20'
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function showLoader(show) {
            const loader = document.getElementById('loader');
            const grid = document.getElementById('grid');
            if (show) {
                loader.classList.remove('hidden');
                grid.classList.add('hidden');
            } else {
                loader.classList.add('hidden');
                grid.classList.remove('hidden');
            }
        }

        function toggleClearIcon(input) {
            const clearBtn = document.getElementById('clearBtn');
            if(input.value.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        }

        function clearSearchInput() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.add('hidden');
            fetchData();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeSearch();
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('statTotal').innerText = data.total_items || 0;
            } catch(e) {}
        }

        async function fetchData(query = '') {
            showLoader(true);
            try {
                const endpoint = query ? `/api/news?q=${encodeURIComponent(query)}` : '/api/news';
                const res = await fetch(endpoint);
                allData = await res.json();
                renderCards();
                fetchStats();
                if(query) showToast(`Search complete for "${query}"`);
            } catch (err) {
                showToast("Failed to retrieve intelligence feed");
            } finally {
                showLoader(false);
            }
        }

        function executeSearch() {
            const query = document.getElementById('searchInput').value.trim();
            fetchData(query);
        }

        function quickSearch(query) {
            document.getElementById('searchInput').value = query;
            document.getElementById('clearBtn').classList.remove('hidden');
            fetchData(query);
        }

        function manualRefresh() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.add('hidden');
            fetchData();
            showToast("Feed synchronized successfully");
        }

        function filterSource(source) {
            currentSource = source;
            document.querySelectorAll('.source-btn').forEach(btn => {
                if (btn.innerText.includes(source) || (source === 'All' && btn.innerText === 'All Sources')) {
                    btn.classList.replace('bg-slate-900/60', 'bg-indigo-600');
                    btn.classList.replace('text-slate-400', 'text-white');
                } else {
                    btn.classList.replace('bg-indigo-600', 'bg-slate-900/60');
                    btn.classList.replace('text-white', 'text-slate-400');
                }
            });
            renderCards();
        }

        function filterDate(filterKey) {
            currentTimeFilter = filterKey;
            document.querySelectorAll('.date-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(filterKey)) {
                    btn.classList.add('bg-indigo-600', 'text-white');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('text-slate-400');
                }
            });
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const now = new Date();

            const filteredData = allData.filter(item => {
                const matchesSource = (currentSource === 'All' || item.source === currentSource);
                if (!matchesSource) return false;

                if (currentTimeFilter === 'all') return true;

                const itemDate = new Date(item.published_at || item.fetched_at);
                const diffHours = (now - itemDate) / (1000 * 60 * 60);

                if (currentTimeFilter === '1d') return diffHours <= 24;
                if (currentTimeFilter === '7d') return diffHours <= (24 * 7);
                if (currentTimeFilter === '30d') return diffHours <= (24 * 30);

                return true;
            });

            if(filteredData.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center text-slate-500 py-24 flex flex-col items-center">
                        <svg class="h-12 w-12 mb-4 opacity-20 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="text-sm font-medium text-slate-400">No records found matching your active filters.</p>
                    </div>`;
                return;
            }

            filteredData.forEach(item => {
                const colorClass = sourceColors[item.source] || 'bg-slate-500/10 text-slate-400 border-slate-500/20';
                const dateObj = new Date(item.published_at || item.fetched_at);
                const dateString = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                const card = `
                    <a href="${item.link}" target="_blank" class="block group">
                        <div class="bg-card rounded-2xl p-5 border border-bordercolor hover:border-indigo-500/40 transition-all duration-300 shadow-lg hover:shadow-indigo-500/5 h-full flex flex-col justify-between relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-indigo-500/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-[11px] font-bold px-2.5 py-1 rounded-lg border ${colorClass}">
                                        ${item.source}
                                    </span>
                                    <span class="text-[11px] text-slate-500 font-mono">${dateString}</span>
                                </div>
                                <h3 class="text-slate-200 text-sm font-medium leading-relaxed group-hover:text-indigo-300 transition-colors line-clamp-3">
                                    ${item.title}
                                </h3>
                            </div>
                            <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-500 group-hover:text-indigo-400 transition-colors">
                                <span>Access Source</span>
                                <svg class="w-3.5 h-3.5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                            </div>
                        </div>
                    </a>
                `;
                grid.innerHTML += card;
            });
        }

        // Initial launch
        fetchData();
        fetchStats();
    </script>
</body>
</html>

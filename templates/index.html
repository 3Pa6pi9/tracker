<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intel Command Center • Global Telemetry Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0b0f19',
                        card: '#131d31',
                        bordercolor: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-slate-300 font-sans min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow">
        <!-- Header Nav -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-bordercolor pb-4 mb-6 gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
                <span class="font-black text-xl text-white tracking-wider flex items-center gap-2">
                    INTEL <span class="text-indigo-400 font-light">ENGINE</span>
                </span>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 text-xs">
                <span id="ws-status" class="px-3 py-1 rounded-lg border border-red-900 bg-red-950/50 text-red-400 font-mono">
                    ● Disconnected
                </span>
                <button onclick="forceSync()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg shadow-md transition-all active:scale-95 flex items-center gap-1.5">
                    ⚡ Sync Live Feed
                </button>
                <button onclick="exportCSV()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition-colors">
                    📥 Export CSV
                </button>
            </div>
        </header>

        <!-- Dynamic Visualization Chart -->
        <div class="bg-card/80 border border-bordercolor rounded-2xl p-4 mb-6 h-60 relative shadow-xl backdrop-blur-md">
            <canvas id="telemetryChart"></canvas>
            <div id="chart-empty" class="absolute inset-0 flex items-center justify-center text-slate-500 font-mono text-xs hidden">
                Awaiting Data Telemetry... Click 'Sync Live Feed' to build velocity charts.
            </div>
        </div>

        <!-- Primary Category Tabs -->
        <div class="flex space-x-2 mb-6 border-b border-bordercolor pb-3">
            <button id="tab-all" onclick="switchCategory('ALL')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-500/20">
                🌐 ALL / GLOBAL TRENDS
            </button>
            <button id="tab-red" onclick="switchCategory('RED')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-400 hover:bg-slate-800">
                🔴 RED (Middle East & Crisis)
            </button>
            <button id="tab-green" onclick="switchCategory('GREEN')" class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-400 hover:bg-slate-800">
                🟢 GREEN (Global Diplomacy)
            </button>
        </div>

        <!-- Search Bar & Filters Console -->
        <div class="bg-card/40 p-4 rounded-2xl border border-bordercolor mb-6 space-y-4">
            <div class="relative">
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search global intel database by keywords..." class="w-full bg-card text-white border border-slate-700/80 rounded-xl pl-4 pr-10 py-3 text-xs focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-inner">
            </div>

            <div class="flex flex-wrap justify-between items-center gap-3 text-xs">
                <!-- Source Buttons -->
                <div class="flex flex-wrap gap-1.5" id="sourceFilters">
                    <button onclick="filterSource('All')" class="src-btn active px-3 py-1 rounded-lg font-semibold bg-indigo-600 text-white">All Sources</button>
                    <button onclick="filterSource('Google News')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800">Google News</button>
                    <button onclick="filterSource('X (Twitter)')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800">X / Twitter</button>
                    <button onclick="filterSource('Reddit')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800">Reddit</button>
                    <button onclick="filterSource('Hacker News')" class="src-btn px-3 py-1 rounded-lg font-semibold bg-slate-900 text-slate-400 hover:bg-slate-800">Hacker News</button>
                </div>

                <!-- Date Range Filters -->
                <div class="flex flex-wrap gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800" id="dateFilters">
                    <button onclick="filterDate('all')" class="date-btn px-3 py-1 rounded-lg font-semibold bg-indigo-600 text-white transition-all">All Time</button>
                    <button onclick="filterDate('1d')" class="date-btn px-3 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">Past 24h</button>
                    <button onclick="filterDate('7d')" class="date-btn px-3 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">Past 7d</button>
                    <button onclick="filterDate('30d')" class="date-btn px-3 py-1 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">Past 30d</button>
                </div>

                <!-- Dropdowns for Region and Target Handle -->
                <div class="flex flex-wrap gap-2">
                    <select id="regionSelect" onchange="applyDropdownFilters()" class="bg-slate-900 text-slate-300 border border-slate-700 text-xs rounded-lg px-3 py-1.5 focus:outline-none">
                        <option value="All">All Regions / Continents</option>
                        <option value="Middle East">Middle East</option>
                        <option value="Africa">Africa</option>
                        <option value="Europe">Europe</option>
                        <option value="Global">Global</option>
                    </select>

                    <select id="handleSelect" onchange="applyDropdownFilters()" class="bg-slate-900 text-slate-300 border border-slate-700 text-xs rounded-lg px-3 py-1.5 focus:outline-none max-w-[200px]">
                        <option value="All">All Target Handles</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Data Grid -->
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-8"></div>

        <!-- Pagination -->
        <div class="flex justify-center mb-8">
            <button id="loadMoreBtn" onclick="loadMore()" class="hidden px-6 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl transition-all shadow-md">
                Load More Intelligence ↓
            </button>
        </div>
    </div>

    <footer class="border-t border-bordercolor py-4 text-center text-xs text-slate-500 bg-card/30">
        Intel Command Center • High-Performance Multi-Source Telemetry Engine
    </footer>

    <script>
        const API_BASE = window.location.origin;
        const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${WS_PROTOCOL}//${window.location.host}/ws/news`;

        let currentCategory = 'ALL';
        let currentSource = 'All';
        let currentRegion = 'All';
        let currentHandle = 'All';
        let currentTimeFilter = 'all';
        let searchQuery = '';
        let currentPage = 1;

        let telemetryChart = null;
        let ws = null;

        const sourceColors = {
            'X (Twitter)': 'bg-blue-500/10 text-blue-400 border-blue-500/20',
            'Google News': 'bg-red-500/10 text-red-400 border-red-500/20',
            'Hacker News': 'bg-orange-500/10 text-orange-400 border-orange-500/20',
            'Reddit': 'bg-orange-600/10 text-orange-500 border-orange-600/20'
        };

        function connectWebSocket() {
            ws = new WebSocket(WS_URL);
            const statusBadge = document.getElementById('ws-status');
            
            ws.onopen = () => {
                statusBadge.className = "px-3 py-1 rounded-lg border border-emerald-900 bg-emerald-950/50 text-emerald-400 font-mono";
                statusBadge.innerHTML = "● Live WebSocket Active";
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.event === "new_intel") {
                    fetchNews(true); 
                    loadChartData();
                    populateHandleDropdown();
                }
            };

            ws.onclose = () => {
                statusBadge.className = "px-3 py-1 rounded-lg border border-red-900 bg-red-950/50 text-red-400 font-mono";
                statusBadge.innerHTML = "● Reconnecting...";
                setTimeout(connectWebSocket, 5000);
            };
        }

        async function populateHandleDropdown() {
            try {
                const res = await fetch(`${API_BASE}/api/meta/filters`);
                const meta = await res.json();
                const handleSelect = document.getElementById('handleSelect');
                
                let html = '<option value="All">All Target Handles</option>';
                meta.handles.forEach(h => {
                    html += `<option value="${h}">${h}</option>`;
                });
                handleSelect.innerHTML = html;
            } catch(e){}
        }

        async function forceSync() {
            alert("Background sync started! Fetching latest Google News, Reddit, Hacker News, and X target posts...");
            await fetch(`${API_BASE}/api/sync`, { method: 'POST' });
        }

        async function fetchNews(overwrite = false) {
            const grid = document.getElementById('grid');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if (overwrite) {
                currentPage = 1;
                grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-16 animate-pulse text-xs font-mono">Querying database...</div>';
            }
            
            try {
                const url = new URL(`${API_BASE}/api/news`);
                url.searchParams.append('category', currentCategory);
                url.searchParams.append('source', currentSource);
                url.searchParams.append('region', currentRegion);
                url.searchParams.append('handle', currentHandle);
                url.searchParams.append('time_filter', currentTimeFilter);
                url.searchParams.append('page', currentPage);
                url.searchParams.append('limit', 15);
                if (searchQuery) url.searchParams.append('q', searchQuery);

                const response = await fetch(url);
                const data = await response.json();
                
                if (overwrite) grid.innerHTML = '';

                if (data.length < 15) {
                    loadMoreBtn.classList.add('hidden');
                } else {
                    loadMoreBtn.classList.remove('hidden');
                }

                if (data.length === 0 && currentPage === 1) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center text-slate-500 py-16 bg-card/20 rounded-2xl border border-bordercolor">
                            <p class="text-xs font-medium text-slate-400">No records found matching your active filter criteria.</p>
                            <p class="text-[11px] text-slate-600 mt-1">Click 'Sync Live Feed' above to ingest global streams.</p>
                        </div>`;
                    return;
                }

                data.forEach(item => {
                    const colorClass = sourceColors[item.source] || 'bg-slate-500/10 text-slate-400 border-slate-500/20';
                    const dateObj = new Date(item.published_date || item.fetched_at);
                    const dateString = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                    const handleBadge = (item.handle && item.handle !== 'N/A') ? `<span class="text-[10px] text-indigo-400 font-mono bg-indigo-500/10 px-1.5 py-0.5 rounded">${item.handle}</span>` : '';

                    const card = `
                        <a href="${item.link}" target="_blank" class="block group">
                            <div class="bg-card rounded-2xl p-5 border border-bordercolor hover:border-indigo-500/40 transition-all duration-300 shadow-lg hover:shadow-indigo-500/5 h-full flex flex-col justify-between relative overflow-hidden">
                                <div>
                                    <div class="flex items-center justify-between mb-3">
                                        <div class="flex items-center space-x-1.5">
                                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg border ${colorClass}">
                                                ${item.source}
                                            </span>
                                            ${handleBadge}
                                        </div>
                                        <span class="text-[10px] text-slate-500 font-mono">${item.region || 'Global'}</span>
                                    </div>
                                    <h3 class="text-slate-200 text-xs font-medium leading-relaxed group-hover:text-indigo-300 transition-colors line-clamp-3">
                                        ${item.title}
                                    </h3>
                                </div>
                                <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center justify-between text-[10px] text-slate-500 group-hover:text-indigo-400 transition-colors">
                                    <span>${dateString}</span>
                                    <span class="flex items-center gap-1 font-bold">Access Source →</span>
                                </div>
                            </div>
                        </a>
                    `;
                    grid.insertAdjacentHTML('beforeend', card);
                });
            } catch (error) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-500 py-12 text-xs">Error loading feeds from server API.</div>`;
            }
        }

        function switchCategory(cat) {
            currentCategory = cat;
            ['all', 'red', 'green'].forEach(c => {
                const btn = document.getElementById(`tab-${c}`);
                if (c === cat.toLowerCase()) {
                    btn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-indigo-600 text-white shadow-lg shadow-indigo-500/20";
                } else {
                    btn.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-400 hover:bg-slate-800";
                }
            });
            fetchNews(true);
        }

        function filterSource(src) {
            currentSource = src;
            document.querySelectorAll('.src-btn').forEach(btn => {
                if (btn.innerText.includes(src) || (src === 'All' && btn.innerText === 'All Sources')) {
                    btn.classList.replace('bg-slate-900', 'bg-indigo-600');
                    btn.classList.replace('text-slate-400', 'text-white');
                } else {
                    btn.classList.replace('bg-indigo-600', 'bg-slate-900');
                    btn.classList.replace('text-white', 'text-slate-400');
                }
            });
            fetchNews(true);
        }

        function filterDate(rangeKey) {
            currentTimeFilter = rangeKey;
            document.querySelectorAll('.date-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(rangeKey)) {
                    btn.classList.add('bg-indigo-600', 'text-white');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white');
                    btn.classList.add('text-slate-400');
                }
            });
            fetchNews(true);
        }

        function applyDropdownFilters() {
            currentRegion = document.getElementById('regionSelect').value;
            currentHandle = document.getElementById('handleSelect').value;
            fetchNews(true);
        }

        let searchTimeout;
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = document.getElementById('searchInput').value.trim();
                fetchNews(true);
            }, 350);
        }

        function loadMore() {
            currentPage++;
            fetchNews(false);
        }

        function exportCSV() {
            window.location.href = `${API_BASE}/api/export?category=${currentCategory}`;
        }

        async function loadChartData() {
            try {
                const response = await fetch(`${API_BASE}/api/stats`);
                const data = await response.json();
                const emptyState = document.getElementById('chart-empty');
                
                if (!data.dates || data.dates.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                } else {
                    emptyState.classList.add('hidden');
                }

                const ctx = document.getElementById('telemetryChart').getContext('2d');
                if(telemetryChart) telemetryChart.destroy();
                
                telemetryChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.dates,
                        datasets: [
                            {
                                label: 'Global Stream',
                                data: data.ALL,
                                borderColor: '#6366f1',
                                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: 'RED Stream',
                                data: data.RED,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            },
                            {
                                label: 'GREEN Stream',
                                data: data.GREEN,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.3
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 10 } } } },
                        scales: {
                            x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 9 } } },
                            y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 9 }, stepSize: 1 } }
                        }
                    }
                });
            } catch (e){}
        }

        // Init Sequence
        connectWebSocket();
        populateHandleDropdown();
        loadChartData();
        fetchNews(true);
    </script>
</body>
</html>
